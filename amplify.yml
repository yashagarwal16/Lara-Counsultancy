version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci
    build:
      commands:
        - env | grep -E '^(NEXT_PUBLIC_SITE_URL|MONGODB_URI|CONTACT_RECIPIENT_[1-4]|MAIL_FROM|SMTP_HOST|SMTP_PORT|SMTP_USER|SMTP_PASSWORD|SMTP_SECURE|ADMIN_EMAIL|ADMIN_PASSWORD|ADMIN_SESSION_SECRET|GEMINI_API_KEY|GEMINI_MODEL|TWILIO_ACCOUNT_SID|TWILIO_AUTH_TOKEN|TWILIO_WHATSAPP_FROM|TWILIO_WHATSAPP_TO)=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
